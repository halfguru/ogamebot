# OGame Bot Configuration
# Copy to config.yaml and fill in your details

ogamex:
  url: "https://main.ogamex.dev" # OGameX server URL
  email: "${OGAMEX_EMAIL}" # OGameX account email
  password: "${OGAMEX_PASSWORD}" # Loaded from env

features:
  defender:
    enabled: false
    pollIntervalMs: 30000 # Check for attacks every 30s
    safetyMarginMs: 120000 # Minimum time before attack arrival to trigger fleet-save (default 2 min)
    recallEnabled: true # Auto-recall fleet after attack passes (default true)
    maxReturnFlightS: 600 # Maximum return flight duration to consider recall-safe (default 10 min)
    minReactionDelayS: 30 # Minimum random delay before reacting to attack (default 30s)
    maxReactionDelayS: 120 # Maximum random delay before reacting to attack (default 120s)
  autoBuild:
    enabled: false
    pollIntervalMs: 30000 # Check for builds every 30s
    # researchOrder: override default research priority (defaults shown)
    # researchOrder:
    #   - EnergyTechnology
    #   - CombustionDrive
    #   - ImpulseDrive
    #   - ComputerTechnology
    #   - HyperspaceTechnology
    #   - HyperspaceDrive
    #   - PlasmaTechnology
    #   - EspionageTechnology
    #   - Astrophysics
  autoFarm:
    enabled: false
    pollIntervalMs: 300000 # Check for farm targets every 5 min

rateLimit:
  defaultMinDelayMs: 2000 # Minimum 2s between requests
  defaultMaxDelayMs: 5000 # Maximum 5s between requests
  endpointOverrides: {}
  # Example: galaxy scanning needs longer delays
  # endpointOverrides:
  #   "/bot/galaxy-infos": { minMs: 5000, maxMs: 10000 }

  logLevel: "info" # trace | debug | info | warn | error | fatal

dashboard:
  enabled: true
  port: 3000
  corsOrigins:
    - "http://localhost:5173"
